name: Build Single Executable

on:
  push:
    tags:
      - 'v*' # Chạy build tự động khi bạn tạo release tag (VD: v1.0, v1.1)
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên giao diện GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    # 1. Tạo file config_private.py tạm thời từ GitHub Secrets
    - name: Generate Config File from Secrets
      shell: bash
      run: |
        cat <<EOF > config_private.py
        USER_CONFIG = {
            "key_title": "${{ secrets.APP_KEY_TITLE }}",
            "token": "${{ secrets.APP_TOKEN }}",
            "username": "${{ secrets.APP_USERNAME }}",
            "email": "${{ secrets.APP_EMAIL }}",
            "passphrase": "${{ secrets.APP_PASSPHRASE }}"
        }
        EOF

    # 2. Đóng gói thành file .exe độc lập
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --add-data "config_private.py;." main.py

    # 3. Đẩy file .exe lên GitHub Artifacts để tải về
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GitHubSSHSetup-Exe
        path: dist/main.exe